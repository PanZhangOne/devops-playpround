apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-playground.secretName" . }}
  labels:
    {{- include "devops-playground.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  DATABASE_URL: {{ include "devops-playground.databaseUrl" . | quote }}
