apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-playground.frontendServiceName" . }}-nginx
  labels:
    {{- include "devops-playground.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name localhost;

      location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://{{ include "devops-playground.backendServiceName" . }}:{{ .Values.backend.service.port }};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
