name: CI-CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/panzhangone/devops-playground-backend:latest
            ghcr.io/panzhangone/devops-playground-backend:${{ github.sha }}


      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/panzhangone/devops-playground-frontend:latest
            ghcr.io/panzhangone/devops-playground-frontend:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: docker-build-and-push

    steps:
      - name: Deploy on self-hosted runner
        run: |
          cd /opt/devops-playground
          echo "IMAGE_TAG=${{ github.sha }}" > infra/.deploy.env
          docker compose \
            --env-file infra/.env.prod \
            --env-file infra/.deploy.env \
            -f infra/docker-compose.prod.yml pull
          docker compose \
            --env-file infra/.env.prod \
            --env-file infra/.deploy.env \
            -f infra/docker-compose.prod.yml up -d
